  The active tiered referral scheme for domestic referrals. Null if no scheme is currently active.
  """
  domestic(
    """
    Use the real implementation instead of stub data. For development testing only.
    """
    developerUseFinalProduct: Boolean! = false

    """
    Raise the given error instead of returning a scheme. For development testing only.
    """
