"""
Derived energy flow values between inverter components.
All values are floored at 0 so negative values are not possible.
"""
type InverterEnergyFlows {
  """
  Energy discharged from battery to grid in kWh.
  Battery discharge is attributed to grid export first, then to home.
  Formula: battery_to_grid = min(battery_export, grid_export).
  """
  batteryToGridKwh: Decimal!

  """
  Energy discharged from battery to home in kWh.
  Formula: battery_to_home = battery_export - battery_to_grid.
  """
  batteryToHomeKwh: Decimal!

  """
  Energy exported from solar to grid in kWh.
  Formula: solar_to_grid = grid_export - battery_to_grid.
  """
  solarToGridKwh: Decimal!

  """
  Energy imported from grid to charge battery in kWh.
  All inverter import is attributed to grid-sourced DC charging (i.e. battery charging).
  Formula: grid_to_battery = inverter_import.
  """
  gridToBatteryKwh: Decimal!

  """
  Energy from solar used to charge battery in kWh.
  Formula: solar_to_battery = battery_import - grid_to_battery
  """
  solarToBatteryKwh: Decimal!

  """
  Energy imported from grid to home in kWh.
  Formula: grid_to_home = grid_import - grid_to_battery
  """
  gridToHomeKwh: Decimal!

  """
  Energy from solar powering the home in kWh.
  Formula: solar_to_home = solar_generated - solar_to_grid - solar_to_battery
  """
  solarToHomeKwh: Decimal!
}

